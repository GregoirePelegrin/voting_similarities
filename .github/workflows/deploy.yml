name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60m
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/app/voting-similarities' }}"

            echo "==> Updating source..."
            cd "$DEPLOY_DIR"
            git checkout main
            git pull --ff-only
            echo "==> Deploying..."
            bash deploy-production.sh
            echo "==> Done."
